services:
  # Management Layer (Web Service)
  - type: web
    name: management-layer
    env: docker
    region: ohio
    plan: free
    dockerContext: ./management_layer
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: streamlink-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: streamlink-redis
          property: connectionString
      - key: PORT
        value: 8000
      - key: GRPC_PORT
        value: 50051

  # Signaling Layer (Web Service)
  - type: web
    name: signaling-layer
    env: docker
    region: ohio
    plan: free
    dockerContext: ./signaling_layer
    envVars:
      - key: SIGNALING_HOST
        value: 0.0.0.0
      - key: SIGNALING_PORT
        value: 8001
      - key: MANAGEMENT_HOST
        fromService:
          type: web
          name: management-layer
          property: host
      - key: MANAGEMENT_PORT
        value: 50051
      - key: REDIS_URL
        fromService:
          type: redis
          name: streamlink-redis
          property: connectionString
      - key: PORT
        value: 8001

  # Redis
  - type: redis
    name: streamlink-redis
    region: ohio
    plan: free
    ipAllowList: []

databases:
  - name: streamlink-db
    databaseName: streamlink
    user: streamlink_user
    plan: free
